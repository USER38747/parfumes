<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | رويال للعطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #121212; --card-bg: #1E1E1E; --text-color: #E0E0E0; --gold: #D4AF37; --error: #ff4d4d; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        nav { padding: 20px 5%; border-bottom: 1px solid rgba(212, 175, 55, 0.2); display: flex; justify-content: space-between; align-items: center; background: #000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); text-decoration: none; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        
        .form-box { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid #333; }
        h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 1.8rem; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: #ccc; }
        input, select { width: 100%; padding: 14px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; font-size: 1rem; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
        
        .order-summary { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px dashed var(--gold); align-self: start; position: sticky; top: 100px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .final-total { font-size: 1.5rem; font-weight: bold; color: var(--gold); border-top: 2px solid var(--gold); padding-top: 15px; margin-top: 10px; }
        
        button.submit-btn { width: 100%; background: var(--gold); color: #000; padding: 18px; font-weight: bold; font-size: 1.2rem; border: none; cursor: pointer; border-radius: 6px; transition: 0.4s; margin-top: 20px; }
        button.submit-btn:hover { background: #b5952f; transform: translateY(-2px); }
        
        .error-msg { color: var(--error); font-size: 0.85rem; display: none; margin-top: 5px; }

        #successModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; text-align: center; }
        .modal-content { background: #fff; color: #000; padding: 50px; border-radius: 15px; max-width: 450px; animation: pop 0.3s ease-out; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .check-circle { width: 80px; height: 80px; background: #2ecc71; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
            .order-summary { position: static; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ROYAL PERFUMES</a>
        <a href="cart.html" style="color: #fff; text-decoration: none;">← العودة للسلة</a>
    </nav>

    <div class="container">
        <form id="checkoutForm" onsubmit="handleOrder(event)">
            <div class="form-box">
                <h2>بيانات الشحن</h2>
                
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="name" placeholder="أدخل اسمك الثلاثي" required>
                </div>
                
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="05 / 06 / 07 XXXXXXXX" required>
                    <span class="error-msg" id="phoneError">يرجى إدخال رقم هاتف جزائري صحيح (10 أرقام)</span>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>الولاية</label>
                        <select id="wilaya" onchange="updateMunicipalities()" required>
                            <option value="">اختر الولاية</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="baladiya" required disabled>
                            <option value="">اختر البلدية</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>العنوان الدقيق (الحي، رقم الشارع، رقم المنزل)</label>
                    <input type="text" id="address" placeholder="مثال: حي 500 مسكن، عمارة B، رقم 12" required>
                </div>

                <div class="form-group">
                    <label>طريقة التوصيل</label>
                    <select id="deliveryType" onchange="calculateFinalTotal()">
                        <option value="500">توصيل للمنزل (500 د.ج)</option>
                        <option value="300">توصيل لمكتب شركة الشحن (300 د.ج)</option>
                    </select>
                </div>
            </div>
        </form>

        <div class="order-summary">
            <h2>ملخص الطلب</h2>
            <div id="itemsPreview"></div>
            <div class="summary-item">
                <span>إجمالي المنتجات:</span>
                <span id="subtotal">0 د.ج</span>
            </div>
            <div class="summary-item">
                <span>تكلفة الشحن:</span>
                <span id="shippingCost">500 د.ج</span>
            </div>
            <div class="summary-item final-total">
                <span>الإجمالي الكلي:</span>
                <span id="grandTotal">0 د.ج</span>
            </div>
            <button type="submit" form="checkoutForm" class="submit-btn">تأكيد الطلب الآن</button>
        </div>
    </div>

    <div id="successModal">
        <div class="modal-content">
            <div class="check-circle">✓</div>
            <h2 style="color: #000; border: none; margin-bottom: 10px;">تم تسجيل طلبك!</h2>
            <p style="color: #666; margin-bottom: 25px;">شكراً لثقتك بنا. سيتصل بك فريقنا قريباً عبر الهاتف لتأكيد العنوان وموعد التسليم.</p>
            <button onclick="clearAndGoHome()" style="padding: 12px 25px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">العودة للمتجر</button>
        </div>
    </div>

        let cart = JSON.parse(localStorage.getItem('perfumeCart')) || [];
        const subtotalValue = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

        // 2. تعبئة قائمة الولايات عند التحميل
        function initCheckout() {
            const wilayaSelect = document.getElementById('wilaya');
            
            // تم تصحيح اسم المتغير هنا من dzData إلى algeriaData
            for (let wilaya in algeriaData) {
                let opt = document.createElement('option');
                opt.value = wilaya;
                opt.textContent = wilaya;
                wilayaSelect.appendChild(opt);
            }
            
            document.getElementById('subtotal').innerText = subtotalValue.toLocaleString() + ' د.ج';
            calculateFinalTotal();
            renderItemsPreview();
        }

        // 3. تحديث البلديات بناءً على الولاية المختارة
        function updateMunicipalities() {
            const wilaya = document.getElementById('wilaya').value;
            const baladiyaSelect = document.getElementById('baladiya');
            
            baladiyaSelect.innerHTML = '<option value="">اختر البلدية</option>';
            
            // تم تصحيح اسم المتغير هنا أيضاً
            if (wilaya && algeriaData[wilaya]) {
                baladiyaSelect.disabled = false;
                algeriaData[wilaya].forEach(muni => {
                    let opt = document.createElement('option');
                    opt.value = muni;
                    opt.textContent = muni;
                    baladiyaSelect.appendChild(opt);
                });
            } else {
                baladiyaSelect.disabled = true;
            }
        }

        // 4. حساب الإجمالي الكلي
        function calculateFinalTotal() {
            const shipping = parseInt(document.getElementById('deliveryType').value);
            const total = subtotalValue + shipping;
            
            document.getElementById('shippingCost').innerText = shipping + ' د.ج';
            document.getElementById('grandTotal').innerText = total.toLocaleString() + ' د.ج';
        }

        // 5. عرض ملخص سريع للمنتجات
        function renderItemsPreview() {
            const container = document.getElementById('itemsPreview');
            container.innerHTML = ""; // مسح المحتوى القديم أولاً
            if (cart.length === 0) {
                container.innerHTML = "<p>السلة فارغة!</p>";
                return;
            }
            cart.forEach(item => {
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#aaa; margin-bottom:5px;">
                        <span>${item.name} (x${item.quantity})</span>
                        <span>${(item.price * item.quantity).toLocaleString()} د.ج</span>
                    </div>
                `;
            });
        }

        // 6. معالجة الطلب والتحقق من البيانات
        function handleOrder(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value.trim();
            const phoneRegex = /^(05|06|07)[0-9]{8}$/;

            if (!phoneRegex.test(phone)) {
                document.getElementById('phoneError').style.display = 'block';
                document.getElementById('phone').focus();
                return;
            } else {
                document.getElementById('phoneError').style.display = 'none';
            }

            document.getElementById('successModal').style.display = 'flex';
        }

        function clearAndGoHome() {
            localStorage.removeItem('perfumeCart');
            window.location.href = 'index.html';
        }

        window.onload = initCheckout;

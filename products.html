<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات | رويال للعطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #121212; --card-bg: #1E1E1E; --text-color: #E0E0E0; --gold: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); }
        
        /* Navbar (Same as Home) */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: #121212; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #fff; text-decoration: none; }
        .cart-icon { position: relative; cursor: pointer; }
        .cart-count { position: absolute; top: -8px; right: -8px; background: var(--gold); color: #000; font-size: 12px; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; }

        /* Filter Section */
        .controls { padding: 30px 5%; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; }
        select, input { background: var(--card-bg); color: #fff; border: 1px solid #333; padding: 10px; border-radius: 5px; outline: none; }
        
        /* Product Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; padding: 0 5% 60px; }
        .product-card { background: var(--card-bg); padding: 15px; border-radius: 8px; transition: 0.3s; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1); }
        .product-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; cursor: pointer; }
        .info { padding: 15px 0; flex-grow: 1; }
        .name { font-size: 1.1rem; margin-bottom: 5px; cursor: pointer; }
        .price { color: var(--gold); font-size: 1.2rem; font-weight: bold; }
        .btn-add { width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-add:hover { background: var(--gold); color: #000; }

        /* Popup Notification */
        .toast { visibility: hidden; min-width: 250px; background-color: var(--gold); color: #000; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ROYAL PERFUMES</a>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html" style="color:var(--gold)">المنتجات</a>
            <a href="cart.html">السلة</a>
        </div>
        <div class="cart-icon" onclick="window.location.href='cart.html'">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
    </nav>

    <div class="controls">
        <h2>كل العطور</h2>
        <div>
            <select id="categoryFilter" onchange="filterProducts()">
                <option value="all">جميع الفئات</option>
                <option value="men">رجالي</option>
                <option value="women">نسائي</option>
                <option value="unisex">للجنسين</option>
            </select>
            <select id="priceFilter" onchange="sortProducts()">
                <option value="default">ترتيب حسب</option>
                <option value="low">السعر: من الأقل للأعلى</option>
                <option value="high">السعر: من الأعلى للأقل</option>
            </select>
        </div>
    </div>

    <div class="products-grid" id="productsContainer">
        </div>

    <div id="toast" class="toast">تمت إضافة المنتج للسلة</div>

    <script>
        // Mock Data
        const products = [
          { id: 1, name: "زهرة الياسمين", price: 8500, category: "women", img: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=400&q=80" },
            { id: 2, name: "بلاك أوبيوم", price: 15000, category: "women", img: "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=400&q=80" },
            { id: 3, name: "سوفاج إكسير", price: 18000, category: "men", img: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=400&q=80" },
            { id: 4, name: "مسك الطهارة", price: 4500, category: "unisex", img: "images (2).jpg" },
            ];

        const container = document.getElementById('productsContainer');
        const cartCount = document.getElementById('cartCount');

        function renderProducts(list) {
            container.innerHTML = '';
            list.forEach(p => {
                const card = `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}" onclick="location.href='details.html?id=${p.id}'">
                        <div class="info">
                            <div class="name" onclick="location.href='details.html?id=${p.id}'">${p.name}</div>
                            <div class="price">${p.price.toLocaleString()} د.ج</div>
                        </div>
                        <button class="btn-add" onclick="addToCart(${p.id})">أضف للسلة</button>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterProducts() {
            const cat = document.getElementById('categoryFilter').value;
            let filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
            renderProducts(filtered);
            sortProducts(filtered); // Maintain sort if active
        }

        function sortProducts(list = null) {
            const sortType = document.getElementById('priceFilter').value;
            let currentList = list || getCurrentList();
            
            if (sortType === 'low') currentList.sort((a, b) => a.price - b.price);
            if (sortType === 'high') currentList.sort((a, b) => b.price - a.price);
            
            if(!list) renderProducts(currentList);
        }

        function getCurrentList() {
             const cat = document.getElementById('categoryFilter').value;
             return cat === 'all' ? [...products] : products.filter(p => p.category === cat);
        }

        function addToCart(id) {
            let cart = JSON.parse(localStorage.getItem('perfumeCart')) || [];
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            localStorage.setItem('perfumeCart', JSON.stringify(cart));
            updateCartCount();
            showToast();
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('perfumeCart')) || [];
            const count = cart.reduce((acc, item) => acc + item.quantity, 0);
            cartCount.textContent = count;
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // Init
        renderProducts(products);
        updateCartCount();
    </script>
</body>
</html>
